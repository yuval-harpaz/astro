name: HST news csv
# docs/hst/*.csv for hst_latest_release.html and color_lab.html (metadata from CADC, files on the STScI S3 mirror)
# then hst_bot.py posts new images of named objects to Bluesky (log: docs/bot_hst_posts.csv)
on:
  workflow_dispatch:
  schedule:
    - cron: '30 */6 * * *'
permissions: write-all
jobs:
  hst-csv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        pip install pandas requests astropy scipy pillow opencv-python-headless atproto
    - name: run script
      run: |
        python hst_news_csv.py --days 10
    - name: HST bot (Bluesky)
      continue-on-error: true
      env:
          BNDL_HST: ${{ secrets.BNDL_HST }}
          BWORD_HST: ${{ secrets.BWORD_HST }}
      run: |
        python hst_bot.py
    - name: check news
      run: |
        git config --global user.name "actions"
        git config --global user.email "actions@github"
        if [ -n "$(git status --porcelain)" ]; then
          echo "IS_NEW=true" >> $GITHUB_ENV
        else
          echo "no changes"
          echo "IS_NEW=false" >> $GITHUB_ENV
        fi
    - name: commit files
      run: |
        git add docs/hst docs/bot_hst_posts.csv
        git commit -m "auto update hst csv"
        git pull --no-rebase --no-edit
      if: ${{ env.IS_NEW == 'true' }}
    - name: push files
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
      if: ${{ env.IS_NEW == 'true' }}
