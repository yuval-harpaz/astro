    #controls button {
      background: #66fcf1;

      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;

    }

    #controls button:hover {
      background: #45a29e;
    }

    #nav-controls {
      display: flex;
      gap: 10px;
    }

      margin-left: auto;
      font-style: italic;
      color: #66fcf1;
    }
    #top-btn {
      display: block;
      margin: 20px auto 30px;
      background: #66fcf1;
      color: #0b0c10;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    #top-btn:hover {
      background: #45a29e;
    }
  </style>

<body>

    <input type="text" id="search-input" placeholder="Target, title, or RA, Dec..." title="A name or words in the title, or a position: RA, Dec in degrees (13.6477, -37.6539) or RA in hours (00:54:35.4 -37:39:14). Names not in the list are looked up in SIMBAD.">

  <div class="container">
    <div class="social-links">
      <h2>By Yuval Harpaz

            alt="github.com/yuval-harpaz" /></a>
        <a href="https://github.com/yuval-harpaz/astro/blob/main/docs/latest.csv" target="_blank"> <img src="csv1.png"

    <div id="earliest-release-info" style="font-size: 0.8em; color: #45a29e; margin-top: 10px;"></div>
    <div id="image-container">Loading...</div>
    <button id="top-btn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" title="Back to the top of the page">↑ Top</button>

    <script src="sky.js"></script>
    <script>
      let allData = [];
      let currentEndDate = new Date();
      let isSearchMode = false;
      let searchQuery = "";
      let searchPos = null;  // {ra, dec, label} for a position search
      const radiusDeg = () => Math.max(0.1, parseFloat(document.getElementById('radius').value) || 3) / 60;

      // CSV times are UTC without a zone ("2026-10-15 21:17:26.995"); force UTC parsing
      function parseUTC(str) {
        return new Date((str || '').trim().replace(' ', 'T') + 'Z');
      }

      async function loadCSV(url) {
        const response = await fetch(url);
        const text = await response.text();
        return parseCSV(text);
      }

      function parseCSV(csv) {
        const lines = csv.trim().split('\n');
        const headers = lines[0].split(',').map(h => h.trim());

        return lines.slice(1).map(line => {
          const values = [];
          let current = '';
          let inQuotes = false;

          for (let i = 0; i < line.length; i++) {
            const char = line[i];
            if (char === '"' && line[i + 1] === '"') {
              current += '"'; // escaped quote
              i++;
            } else if (char === '"') {
              inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
              values.push(current);
              current = '';
            } else {
              current += char;
            }
          }
          values.push(current); // last value

          const obj = {};
          headers.forEach((header, i) => {
            let value = values[i]?.trim() || '';

            // Special case: convert mast: to full URL in jpegURL and dataURL
            if ((header === 'jpegURL' || header === 'dataURL') && value.startsWith('mast:')) {
              value = value.replace(
                'mast:',
                'https://mast.stsci.edu/portal/Download/file/'
              );
            }

            obj[header] = value;
          });

          return obj;
        });
      }

      let viewSeq = 0;
      const normalize = (str) => (str || "").toLowerCase().replace(/[^a-z0-9]/g, "");
      async function updateView() {
        const container = document.getElementById('image-container');
        const title = document.getElementById('main-title');
        const rangeSpan = document.getElementById('current-range');
        const seq = ++viewSeq;

        container.innerHTML = '';

        let filteredData = [];
        if (isSearchMode && searchPos) {
          const r = radiusDeg();
          filteredData = Sky.cone(allData, searchPos, r);
          title.innerText = `Near ${searchPos.label}, within ${+(r * 60).toFixed(2)}′`;
          rangeSpan.innerText = `${filteredData.length} images, nearest first`;
        } else if (isSearchMode) {
          const normalize = (str) => (str || "").toLowerCase().replace(/[^a-z0-9]/g, "");
          const query = searchQuery.toLowerCase();
          const normalizedQuery = normalize(searchQuery);

          filteredData = allData.filter(item => {
            const targetName = (item.target_name || "").toLowerCase();
            const obsTitle = (item.obs_title || "").toLowerCase();
            const jpegURL = (item.jpegURL || "").toLowerCase();
            const dataURL = (item.dataURL || "").toLowerCase();

            return targetName.includes(query) ||
              normalize(targetName).includes(normalizedQuery) ||
              obsTitle.includes(query) ||
              jpegURL.includes(query) ||
              dataURL.includes(query);
          });
          title.innerText = `Search Results: "${searchQuery}"`;
          rangeSpan.innerText = `${filteredData.length} matches found`;
          if (!filteredData.length) {
            container.innerHTML = `<p>No match in the list; looking up "${searchQuery.replace(/</g, '&lt;')}" in SIMBAD...</p>`;
            const s = await Sky.resolve(searchQuery).catch(() => null);
            if (seq !== viewSeq) return;
            if (s) { searchPos = { ra: s.ra, dec: s.dec, label: `${s.name} (${Sky.fmt(s.ra, s.dec)})` }; return updateView(); }
          }
        } else {
          const startDate = new Date(currentEndDate.getTime() - 7 * 24 * 60 * 60 * 1000);
          filteredData = allData.filter(item => {
            const date = parseUTC(item.t_obs_release);
            return date.getTime() > startDate.getTime() && date.getTime() <= currentEndDate.getTime();
          });

          const endStr = currentEndDate.toISOString().split('T')[0];
          const startStr = startDate.toISOString().split('T')[0];

          const now = new Date();
          const isLatest = (now.getTime() - currentEndDate.getTime() < 3600000); // within 1 hour

          if (isLatest) {
            title.innerText = "Latest JWST Image Releases (Past 7 Days)";
          } else {
            title.innerText = `JWST Releases: ${startStr} to ${endStr}`;
          }

          rangeSpan.innerText = "";
          document.getElementById('next-btn').disabled = isLatest;
        }

        if (filteredData.length === 0) {
          container.innerHTML = '<p>No images found for this criteria.</p>';
          return;
        }

        if (!searchPos || !isSearchMode) filteredData.sort((a, b) => parseUTC(b.t_obs_release) - parseUTC(a.t_obs_release));

        filteredData.forEach(item => {
          const card = document.createElement('div');
          const fitsUrl = item.jpegURL ? item.jpegURL.replace(/\.\w+$/, '.fits') : '#';
          const filterMatch = item.jpegURL ? item.jpegURL.match(/[-_]f(.*?)_i2d/) : null;
          const filter = filterMatch ? filterMatch[1] : 'unknown filter';
          const releaseDate = parseUTC(item.t_obs_release);
          const utcDateOnly = releaseDate.toISOString().split('T')[0];
          const obsDate = parseUTC(item.t_max);
          const utcMax = obsDate.toISOString().split('T')[0];
          const instrument = item.instrument_name.replace("/IMAGE", "")
          const titleText = item.obs_title
          const fits = fitsUrl.split('/')[8] || 'File';

          card.className = 'image-card';
          card.innerHTML = `
          <img src="${item.jpegURL || ''}" alt="${item.target_name || ''}" title="${fits}">
          <div class="image-info">
              <h2>${item.target_name}</h2>
              <p>Instrument: ${instrument}. Filter: f${filter}.</p>
              <p>Proposal ID: ${item.proposal_id}, PI: ${item.proposal_pi}.</p>
              <p>Observed: ${utcMax}. Released: ${utcDateOnly}</p>
              <p>Title: ${titleText}</p>
              ${item.s_ra ? `<p>RA, Dec: <a href="#" class="near" data-ra="${item.s_ra}" data-dec="${item.s_dec}" style="color:#66fcf1;" title="Show images near this position">${Sky.fmt(item.s_ra, item.s_dec)}</a>`
                + (isSearchMode && searchPos ? ` (${(item._sep * 60).toFixed(1)}′ away)` : ` (image radius ${(item.s_rad * 60).toFixed(1)}′)`) + '</p>' : ''}
              <p><a href="${fitsUrl}" target="_blank" style="color:#66fcf1;">&dArr; FITS</a> ·
                <a href="color_lab.html?${new URLSearchParams({ q: item.target_name || '' })}" target="_blank" style="color:#66fcf1;" title="Make a color image of this target in JWST Color Lab (PC)">Color Lab</a></p>
          </div>
        `;
          container.appendChild(card);
        });
      }

      // Event Listeners
      const searchInput = document.getElementById('search-input');
      const searchPosition = (p) => { searchPos = p; isSearchMode = true; updateView(); };
      Sky.searchBox({
        input: searchInput, button: document.getElementById('search-btn'),
        localNames: async (t) => { const n = normalize(t), out = new Set();
          for (const it of allData) if (normalize(it.target_name).includes(n)) out.add(it.target_name);
          return [...out]; },
        onText: (t) => { searchQuery = t; searchPos = null; isSearchMode = true; updateView(); },
        onPos: searchPosition,
      });
      document.getElementById('radius').onchange = () => { if (isSearchMode && searchPos) updateView(); };
      document.getElementById('image-container').addEventListener('click', (e) => {
        const a = e.target.closest('a.near');
        if (!a) return;
        e.preventDefault();
        const p = { ra: +a.dataset.ra, dec: +a.dataset.dec };
        searchInput.value = Sky.fmt(p.ra, p.dec);
        window.scrollTo(0, 0);
        searchPosition({ ...p, label: searchInput.value });
      });

      document.getElementById('prev-btn').onclick = () => {
        if (isSearchMode) {
          isSearchMode = false;
          currentEndDate = new Date(); // Reset to latest
        } else {
          currentEndDate = new Date(currentEndDate.getTime() - 7 * 24 * 60 * 60 * 1000);
        }
        updateView();
      };

      document.getElementById('next-btn').onclick = () => {
        if (isSearchMode) {
          isSearchMode = false;
          currentEndDate = new Date(); // Reset to latest
        } else {
          const nextDate = new Date(currentEndDate.getTime() + 7 * 24 * 60 * 60 * 1000);
          const now = new Date();
          currentEndDate = nextDate > now ? now : nextDate;
        }
        updateView();
      };

      // Initial Load
      const baseRemoteUrl = 'https://raw.githubusercontent.com/yuval-harpaz/astro/refs/heads/main/docs/';
      Promise.all([
        loadCSV(baseRemoteUrl + 'latest.csv'),
        loadCSV(baseRemoteUrl + 'older.csv').catch(err => {
          console.warn("Could not load older.csv, proceeding with latest only.", err);
          return []; // Fallback if older doesn't exist yet or fails
        })
      ])
        .then(([latestData, olderData]) => {
          allData = [...latestData, ...olderData];

          // Ensure chronological ordering (newest first)
          allData.sort((a, b) => parseUTC(b.t_obs_release) - parseUTC(a.t_obs_release));

          // Calculate earliest release date
          if (allData.length > 0) {
            const releaseDates = allData.map(item => parseUTC(item.t_obs_release)).filter(d => !isNaN(d));
            if (releaseDates.length > 0) {
              const earliest = new Date(Math.min(...releaseDates));
              const earliestStr = earliest.toISOString().split('T')[0];
              document.getElementById('earliest-release-info').innerText = `Dataset spans from ${earliestStr} to today. Level 3 science images. Total records: ${allData.length}`;
            }
          }

          updateView();
        })
        .catch(err => {
          document.getElementById('image-container').innerHTML = '<p>Error loading data.</p>';
          console.error(err);
        });
    </script>
